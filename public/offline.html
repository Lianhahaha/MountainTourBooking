<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d1117" />
    <title>Offline — Tikling Apo Tours</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1117;
        --surface: #161b22;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --green: #238636;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        max-width: 26rem;
        padding: 1.5rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface);
      }
      .mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2rem;
        height: 2rem;
        border-radius: 6px;
        background: var(--green);
        font-weight: 700;
      }
      h1 {
        margin: 1rem 0 0.25rem;
        font-size: 1.25rem;
      }
      p {
        margin: 0.5rem 0 0;
        color: var(--muted);
        font-size: 0.9375rem;
      }
      a {
        display: inline-block;
        margin-top: 1.25rem;
        padding: 0.625rem 1.25rem;
        border-radius: 6px;
        background: var(--green);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">▲</span>
      <h1>You're offline</h1>
      <p>
        This page needs a connection. Reconnect and try again, or call us at
        <a href="tel:+639170000000" style="display:inline;padding:0;background:none;color:inherit;text-decoration:underline">+63 917 000 0000</a>.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
